name: Specification Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: geraihub
          POSTGRES_DB: geraihub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geraihub -d geraihub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://geraihub@127.0.0.1:5432/geraihub_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate canonical repository contracts
        run: python3 scripts/check-repository.py .

      - name: Test specification validator regressions
        run: python3 scripts/test-check-repository.py

      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration history
        run: |
          pnpm db:generate
          git diff --exit-code -- drizzle

      - name: Apply local migration and synthetic seed
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Validate application foundation
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
